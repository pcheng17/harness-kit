[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-kit"
version = "0.1.0"
description = "Personal multi-harness agent configuration"
requires-python = ">=3.11"

[project.scripts]
harness-kit = "harness_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_kit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
