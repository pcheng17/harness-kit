name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - name: Verify Python lockfile
        run: uv lock --check
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
